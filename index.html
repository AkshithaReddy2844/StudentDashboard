<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        .card{
          width:300px;
            border:2px solid rgb(27, 26, 26);
            border-radius:20px;
            box-shadow: 0 4px 8px gray;
            margin:auto;
            padding:20px;
           
        }
        .b{
            text-align: center;
        }
    </style>
</head>
<body>
    <h1 style="text-align: center;color:rgb(11, 78, 78)">Welcome to Student Management System</h1>
    <div class="card">
    <form id="registerForm">

      <label for="username">Enter UserName</label>
        <input type="text" id="username" placeholder="Enter your Name">
        <br><br>
              <label for="email">Enter Email</label>
        <input type="text" id="email" placeholder="Enter your Email">
        <br><br>
             <label for="password">Enter Password</label>
        <input type="password" id="password" placeholder="Enter password">
        <br><br>
             

    <button type="submit">Register</button>
</form>
</div>

<p style="text-align: center;font-size: 20px;">Already have an Account?<a href="login.html">login</a></p>
<script>
document.getElementById("registerForm")
.addEventListener("submit", function(e){

    e.preventDefault();

    let username =
    document.getElementById("username").value;

    let password =
    document.getElementById("password").value;

    
    let email =
    document.getElementById("email").value;
    let users =
    JSON.parse(localStorage.getItem("users")) || [];

    let exists =
    users.find(user => user.username === username);

    if(exists){
        alert("Username already exists");
        return;
    }

    users.push({
        username,
        password,email
    });

    localStorage.setItem(
        "users",
        JSON.stringify(users)
    );

    alert("Registration Successful");

    window.location.href = "login.html";
});
</script>
</body>
</html>
